name: inventory
version: 0.7.0
description: Convert a hand-authored asset-inventory manifest (external drives + hardware/RPis/IoT) to searchable markdown with typed inventory entities
license: MIT

conformance:
  config:
    manifest: tests/fixtures/inventory.yaml

creates_dirs:
  - inventory

config:
  manifest:
    required: true
    description: Path to the hand-authored YAML inventory manifest (top-level `drives:` and `devices:` lists, optional owner-set `complete_as_of:` date; any other key is an error). Relative paths resolve against the store root.

---
name: inventory-finddump
version: 0.7.0
description: Sweep configured drive content-roots (fd/pathspec scan+ignore adapter) into searchable per-drive find-dump markdown shards
license: MIT
module: finddump

creates_dirs:
  - inventory/find-dump

config:
  drives:
    required: true
    description: "List of drives to sweep: each entry is either {id, roots: [<mounted path>, ...]} (explicit mount paths) or {id, mount: {serial?, uuid?, label?}, content_roots: [<relpath>...]} (automatic online-drive detection -- content_roots resolve relative to the detected mountpoint; omit to sweep the whole mountpoint). Without serial, uuid OR label matches. With serial (the disk's hardware ID_SERIAL_SHORT, which survives reformats and reused labels), only partitions on that disk are candidates and uuid/label picks one; serial alone works for a disk with a single mounted partition and raises if it has several. A drive that isn't currently online is skipped gracefully. The summary records the parent disk's serial as disk_serial."
